<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#135457">
<link rel="apple-touch-icon" href="https://i.imgur.com/RPHGLkN.png">
<link rel="icon" type="image/png" href="https://i.imgur.com/RPHGLkN.png">
<title>Convocatoria a Asamblea — Club de Campo La Eugenia</title>
<meta property="og:title" content="Convocatoria a Asamblea General Ordinaria — Club de Campo La Eugenia">
<meta property="og:description" content="Fecha, hora, lugar y Orden del Día de la próxima Asamblea">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 0; background: #f1efe8; font-family: Arial, Helvetica, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; }
  .banner-img { width: 100%; display: block; border: 0; }
  .titulo-bar { background: #135457; padding: 0px 24px 14px; text-align: center; line-height: 1; }
  .titulo-bar div { color: #ffffff; font-size: 16px; font-weight: bold; text-transform: uppercase; font-family: Impact, Arial, sans-serif; letter-spacing: 1px; line-height: 1.2; padding-top: 0; }
  .contenido { padding: 28px 24px 12px; }
  .saludo { color: #135457; font-size: 14px; line-height: 1.6; margin: 0; }
  .datos-box { margin: 18px 0; border: 2px solid #135457; border-radius: 10px; overflow: hidden; }
  .dato-fila { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #b7d6b5; border-bottom: 1px solid #135457; }
  .dato-fila:last-child { border-bottom: none; }
  .dato-icono { font-size: 18px; width: 24px; text-align: center; }
  .dato-label { color: #135457; font-size: 10px; font-weight: bold; text-transform: uppercase; display: block; }
  .dato-valor { color: #135457; font-size: 14px; font-weight: bold; }

  .seccion-titulo { color: #135457; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #c4df57; padding-bottom: 6px; margin: 22px 0 10px; }
  .orden-item { border-left: 3px solid #135457; background: #f5f3ec; border-radius: 0 8px 8px 0; padding: 12px 14px; margin-bottom: 8px; }
  .orden-item div { color: #135457; font-size: 13px; line-height: 1.5; }

  .aviso-box { background: #deaf4d; border-radius: 10px; padding: 16px; margin-top: 18px; text-align: center; }
  .aviso-box p { color: #135457; font-size: 12px; line-height: 1.6; margin: 0 0 10px; text-align: left; }
  .aviso-box p:last-of-type { margin-bottom: 0; }
  .aviso-box a { display: inline-block; margin-top: 12px; background: #135457; color: #c4df57; font-size: 12px; font-weight: bold; text-transform: uppercase; padding: 9px 18px; border-radius: 20px; text-decoration: none; }

  .cta { display: block; text-align: center; margin-top: 22px; padding-top: 22px; }
  .cta .label { color: #135457; font-size: 12px; margin: 0 0 10px; line-height: 1.4; }
  .cta a { display: inline-block; background: #c4df57; color: #135457; font-size: 13px; font-weight: bold; text-transform: uppercase; padding: 12px 28px; border-radius: 8px; border: 2px solid #135457; text-decoration: none; }

  .firma { color: #135457; font-size: 14px; line-height: 1.6; margin: 22px 0 0; text-align: center; font-weight: bold; }
  .footer-note { border-top: 1px solid #d8d4c5; margin: 24px 24px 0; padding-top: 14px; }
  .footer-note div { color: #888780; font-size: 11px; line-height: 1.6; text-align: center; padding-bottom: 18px; }

  .loading { text-align: center; color: #135457; font-weight: bold; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap" id="tarjeta">
  <img class="banner-img" src="banner-convocatoria.png" alt="Convocatoria — La Eugenia Club de Campo">
  <div class="titulo-bar"><div>Asamblea General Ordinaria</div></div>
  <div class="contenido">
    <div class="loading" id="loading">Cargando...</div>
    <div id="cuerpo" style="display:none;"></div>
  </div>
</div>

<script>
const EXEC_URL_GI = 'https://script.google.com/macros/s/AKfycbyBxlDAteVncpf2hyQ-Nna6YZjMiZodntG9gZZ9aPXPei1As_yhqMUCnjnM9mHmJYYZJg/exec';

function jsonp(url, cb) {
  const cbName = 'cb_' + Date.now() + Math.floor(Math.random()*100000);
  window[cbName] = function(res) { delete window[cbName]; document.body.removeChild(script); cb(res); };
  const script = document.createElement('script');
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  document.body.appendChild(script);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

jsonp(EXEC_URL_GI + '?action=obtenerAsambleaEjercicio', function(res) {
  document.getElementById('loading').style.display = 'none';
  const cuerpo = document.getElementById('cuerpo');
  cuerpo.style.display = 'block';

  if (!res || !res.ok) {
    cuerpo.innerHTML = '<p class="saludo">Todavía no hay una Asamblea convocada.</p>';
    return;
  }

  const fecha = new Date(res.fecha);
  const fechaLegible = fecha.toLocaleDateString('es-AR', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  let html = '<p class="saludo">Estimados socios:</p>';
  html += '<p class="saludo" style="margin-top:8px;">La Comisión Directiva convoca a la Asamblea General Ordinaria, que se realizará según los siguientes datos:</p>';

  html += '<div class="datos-box">';
  html += '<div class="dato-fila"><span class="dato-icono">📅</span><div><span class="dato-label">Fecha</span><span class="dato-valor">' + fechaLegible + '</span></div></div>';
  html += '<div class="dato-fila"><span class="dato-icono">🕓</span><div><span class="dato-label">Hora</span><span class="dato-valor">' + res.hora + ' hs</span></div></div>';
  html += '<div class="dato-fila"><span class="dato-icono">📍</span><div><span class="dato-label">Lugar</span><span class="dato-valor">' + escapeHtml(res.lugar) + '</span></div></div>';
  html += '</div>';

  html += '<div class="seccion-titulo">Orden del Día</div>';
  if (res.ordenDelDia && res.ordenDelDia.length > 0) {
    res.ordenDelDia.forEach(punto => {
      html += '<div class="orden-item"><div>' + escapeHtml(punto) + '</div></div>';
    });
  } else {
    html += '<div class="orden-item"><div style="opacity:.6;">Todavía no se cargó el Orden del Día.</div></div>';
  }

  html += '<div class="aviso-box"><p>Conforme al Estatuto Social, si a la hora fijada no se reuniera la mayoría absoluta de los asociados con derecho a voto, la Asamblea se celebrará válidamente una hora después, con los socios presentes.</p><p>Solo pueden participar y votar los socios activos que se encuentren al día con el pago de sus cuotas sociales.</p><a href="https://drive.google.com/file/d/1snLbDhjf8ZypCF_ZWUf7NaGiHlXvU-W5/view" target="_blank">Ver Estatuto Social</a></div>';

  html += '<div class="firma">Comisión Directiva<br>Asociación Civil La Eugenia</div>';

  html += '<div class="cta"><div class="label">Para más información sobre trámites y servicios</div><a href="https://clubdecampolaeugenia.taplink.site/" target="_blank">Ir al Centro de Gestión Vecinal</a></div>';

  cuerpo.innerHTML = html;
});
</script>
<div class="wrap" style="margin-top:0; border-radius:0 0 12px 12px;">
  <div class="footer-note"><div>Este es un documento informativo de la Convocatoria — el texto formal de la citación y los edictos se gestionan por Secretaría.</div></div>
  <img class="banner-img" src="https://i.imgur.com/IBrRPKL.png" alt="La Eugenia Club de Campo">
</div>
</body>
</html>

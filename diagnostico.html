<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; padding: 20px; font-size: 14px; word-break: break-word; }
  h1 { color: #fff; font-size: 16px; }
</style>
</head>
<body>
<h1>Probando UNA escritura de prueba...</h1>
<div id="out">esperando respuesta...</div>

<script>
const EXEC_URL_GI = 'https://script.google.com/macros/s/AKfycbyBxlDAteVncpf2hyQ-Nna6YZjMiZodntG9gZZ9aPXPei1As_yhqMUCnjnM9mHmJYYZJg/exec';

const params = new URLSearchParams({
  action: 'guardarAutoridad',
  organo: 'COMISION_DIRECTIVA',
  cargo: 'Presidente',
  nombre: 'PRUEBA DIAGNOSTICO',
  dni: '',
  fechaInicio: '2025-10-25',
  pin: '1923'
});

const cbName = 'cbDiag';
window[cbName] = function(res) {
  document.getElementById('out').textContent = JSON.stringify(res, null, 2);
};

const script = document.createElement('script');
script.src = EXEC_URL_GI + '?' + params.toString() + '&callback=' + cbName;
script.onerror = function() {
  document.getElementById('out').textContent = 'ERROR: el script ni siquiera cargó (fallo de red/URL/deploy).';
};
document.body.appendChild(script);
</script>
</body>
</html>

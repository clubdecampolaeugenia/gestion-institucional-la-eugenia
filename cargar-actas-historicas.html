function jsonp(url, cb) {
  const cbName = 'cb_' + Date.now() + Math.floor(Math.random()*100000);
  window[cbName] = function(res) { delete window[cbName]; document.body.removeChild(script); cb(res); };
  const script = document.createElement('script');
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  document.body.appendChild(script);
}

const log = document.getElementById('log');

async function cargarTodo() {
  for (const a of ACTAS) {
    const div = document.createElement('div');
    div.className = 'item';
    div.textContent = 'Acta N.\u00ba ' + a.idActa + ' \u2014 cargando...';
    log.appendChild(div);

    await new Promise(resolve => {
      const params = new URLSearchParams({
        action: 'guardarActaHistorica',
        idActa: a.idActa,
        idEjercicio: 'EJ-037',
        fechaReunion: a.fecha,
        horaInicio: a.horaInicio,
        horaFin: a.horaFin,
        presentes: a.presentes,
        puntos: JSON.stringify(a.puntos),
        idActaAnterior: a.anterior,
        estado: 'FIRMADA',
        pin: '1923'
      });
      jsonp(EXEC_URL_GI + '?' + params.toString(), function(res) {
        if (res && res.ok) {
          div.className = 'item ok';
          div.textContent = '\u2705 Acta N.\u00ba ' + a.idActa;
        } else {
          div.className = 'item error';
          div.textContent = '\u274c Acta N.\u00ba ' + a.idActa + ' \u2014 ' + (res && res.error ? res.error : 'error desconocido');
        }
        resolve();
      });
    });
  }
  const done = document.createElement('h1');
  done.textContent = '\u2705 Listo. Pod\u00e9s cerrar esta p\u00e1gina.';
  log.appendChild(done);
}

cargarTodo();

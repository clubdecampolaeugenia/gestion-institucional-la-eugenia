<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carga de novedades faltantes (de la Memoria original de Yani)</title>
<style>
  body { font-family: sans-serif; background: #135457; color: #f5f3ec; padding: 20px; }
  .item { padding: 10px 14px; margin-bottom: 8px; border-radius: 10px; background: rgba(255,255,255,0.08); }
  .ok { background: #2d6a4f; }
  .error { background: #c0392b; }
  h1 { font-size: 16px; }
</style>
</head>
<body>
<h1>Cargando 3 novedades (calles, alumbrado, ramas)...</h1>
<div id="log"></div>

<script>
const EXEC_URL_GI = 'https://script.google.com/macros/s/AKfycbyBxlDAteVncpf2hyQ-Nna6YZjMiZodntG9gZZ9aPXPei1As_yhqMUCnjnM9mHmJYYZJg/exec';
const NOVEDADES = [{"fecha": "10/03/2026", "titulo": "Mejoras en calles internas: entoscado y piedra triturada", "descripcion": "A partir de las gestiones realizadas ante la Municipalidad de Garupá y la Dirección Provincial de Vialidad, se ejecutaron trabajos de entoscado en distintos sectores y colocación de piedra triturada en varias calles del barrio, contribuyendo a mejorar significativamente la transitabilidad.", "categoria": "Municipalidad", "montoSiCorresponde": ""}, {"fecha": "15/01/2026", "titulo": "Alumbrado público: reposición de luminarias", "descripcion": "Se continuó con la colocación y reposición de luminarias para el alumbrado público, financiadas con recursos propios. Varios socios colaboraron adquiriendo directamente las luminarias o focos necesarios frente a sus propiedades, permitiendo que el Club afronte solo los costos de instalación.", "categoria": "Alumbrado", "montoSiCorresponde": ""}, {"fecha": "15/09/2025", "titulo": "Cronograma de recolección de ramas", "descripcion": "Se mantuvo el cronograma periódico de recolección de ramas, tarea realizada por personal del Club, generando ahorro frente a la contratación de servicios externos. En determinadas oportunidades se contó con la colaboración de la Municipalidad de Garupá mediante el préstamo de camiones. Las podas de gran magnitud continúan siendo responsabilidad de cada propietario.", "categoria": "Mantenimiento", "montoSiCorresponde": ""}];

function jsonp(url, cb) {
  const cbName = 'cb_' + Date.now() + Math.floor(Math.random()*100000);
  window[cbName] = function(res) { delete window[cbName]; document.body.removeChild(script); cb(res); };
  const script = document.createElement('script');
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  document.body.appendChild(script);
}

const log = document.getElementById('log');

async function cargarTodo() {
  for (const n of NOVEDADES) {
    const div = document.createElement('div');
    div.className = 'item';
    div.textContent = n.titulo + ' — cargando...';
    log.appendChild(div);
    await new Promise(resolve => {
      const params = new URLSearchParams({ action: 'guardarNovedadesSeleccionadas', novedades: JSON.stringify([n]), pin: '1923' });
      jsonp(EXEC_URL_GI + '?' + params.toString(), function(res) {
        div.className = res && res.ok && res.guardadas > 0 ? 'item ok' : 'item error';
        div.textContent = (res && res.ok && res.guardadas > 0 ? '\u2705 ' : '\u274c ') + n.titulo;
        resolve();
      });
    });
  }
  const done = document.createElement('h1');
  done.textContent = '\u2705 Listo.';
  log.appendChild(done);
}

cargarTodo();
</script>
</body>
</html>

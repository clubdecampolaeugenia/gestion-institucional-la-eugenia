<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrección de fechas aproximadas</title>
<style>
  body { font-family: sans-serif; background: #135457; color: #f5f3ec; padding: 20px; }
  .item { padding: 10px 14px; margin-bottom: 8px; border-radius: 10px; background: rgba(255,255,255,0.08); }
  .ok { background: #2d6a4f; }
  .error { background: #c0392b; }
  h1 { font-size: 16px; }
</style>
</head>
<body>
<h1>Corrigiendo etiquetas y fecha de juegos infantiles...</h1>
<div id="log"></div>

<script>
const EXEC_URL_GI = 'https://script.google.com/macros/s/AKfycbyBxlDAteVncpf2hyQ-Nna6YZjMiZodntG9gZZ9aPXPei1As_yhqMUCnjnM9mHmJYYZJg/exec';
const EDICIONES = [{"id": "NOV-20260809201222-0", "titulo": "Reparación de quinchos de paja", "descripcion": "Se realizaron tareas de reparación de los quinchos de paja del predio durante el mes de octubre de 2025."}, {"id": "NOV-20260809201225-0", "titulo": "Pintura general del sector club house y pileta", "descripcion": "Se realizaron trabajos de pintura general en el sector del club house y la pileta durante el mes de noviembre de 2025."}, {"id": "NOV-20260809201229-0", "titulo": "Reparación de ventanas y puertas del salón", "descripcion": "Se realizaron trabajos de reparación de ventanas y puertas del salón de usos múltiples durante el mes de marzo de 2026."}, {"id": "NOV-20260809201232-0", "titulo": "Cambio de puerta del depósito de herramientas", "descripcion": "Se realizó el cambio de la puerta del depósito de herramientas durante el mes de abril de 2026."}];
const JUEGOS = {"fecha": "15/02/2026", "titulo": "Reparación de juegos infantiles", "descripcion": "Se repararon y pintaron los juegos infantiles del predio durante el mes de febrero de 2026, mejorando las condiciones de seguridad y recreación para los niños.", "categoria": "Infraestructura", "montoSiCorresponde": ""};

function jsonp(url, cb) {
  const cbName = 'cb_' + Date.now() + Math.floor(Math.random()*100000);
  window[cbName] = function(res) { delete window[cbName]; document.body.removeChild(script); cb(res); };
  const script = document.createElement('script');
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  document.body.appendChild(script);
}

const log = document.getElementById('log');

async function correrTodo() {
  for (const e of EDICIONES) {
    const div = document.createElement('div');
    div.className = 'item';
    div.textContent = e.titulo + ' — actualizando...';
    log.appendChild(div);
    await new Promise(resolve => {
      const params = new URLSearchParams({ action: 'actualizarNovedad', idNovedad: e.id, titulo: e.titulo, descripcion: e.descripcion, pin: '1923' });
      jsonp(EXEC_URL_GI + '?' + params.toString(), function(res) {
        div.className = res && res.ok ? 'item ok' : 'item error';
        div.textContent = (res && res.ok ? '\u2705 ' : '\u274c ') + e.titulo;
        resolve();
      });
    });
  }

  const divDel = document.createElement('div');
  divDel.className = 'item';
  divDel.textContent = 'Borrando juegos infantiles con fecha vieja...';
  log.appendChild(divDel);
  await new Promise(resolve => {
    jsonp(EXEC_URL_GI + '?action=eliminarNovedad&idNovedad=NOV-20260809193532-0&pin=1923', function(res) {
      divDel.className = res && res.ok ? 'item ok' : 'item error';
      divDel.textContent = res && res.ok ? '\u2705 Borrada' : '\u26a0\ufe0f No encontrada';
      resolve();
    });
  });

  const divNew = document.createElement('div');
  divNew.className = 'item';
  divNew.textContent = 'Recargando juegos infantiles con fecha correcta (febrero 2026)...';
  log.appendChild(divNew);
  await new Promise(resolve => {
    const params = new URLSearchParams({ action: 'guardarNovedadesSeleccionadas', novedades: JSON.stringify([JUEGOS]), pin: '1923' });
    jsonp(EXEC_URL_GI + '?' + params.toString(), function(res) {
      divNew.className = res && res.ok && res.guardadas > 0 ? 'item ok' : 'item error';
      divNew.textContent = res && res.ok && res.guardadas > 0 ? '\u2705 Recargada' : '\u274c error';
      resolve();
    });
  });

  const done = document.createElement('h1');
  done.textContent = '\u2705 Listo.';
  log.appendChild(done);
}

correrTodo();
</script>
</body>
</html>

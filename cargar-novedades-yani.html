<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carga de Novedades — Memoria de Yani</title>
<style>
  body { font-family: sans-serif; background: #135457; color: #f5f3ec; padding: 20px; }
  .item { padding: 10px 14px; margin-bottom: 8px; border-radius: 10px; background: rgba(255,255,255,0.08); }
  .ok { background: #2d6a4f; }
  .error { background: #c0392b; }
  h1 { font-size: 16px; }
</style>
</head>
<body>
<h1>Cargando 3 novedades (Memoria de Yani + fecha confirmada CGV)...</h1>
<div id="log"></div>

<script>
const EXEC_URL_GI = 'https://script.google.com/macros/s/AKfycbyBxlDAteVncpf2hyQ-Nna6YZjMiZodntG9gZZ9aPXPei1As_yhqMUCnjnM9mHmJYYZJg/exec';
const NOVEDADES = [{"fecha": "15/11/2025", "titulo": "[FECHA APROX.] Reparación de juegos infantiles", "descripcion": "Se repararon y pintaron los juegos infantiles del predio, mejorando las condiciones de seguridad y recreación para los niños.", "categoria": "Infraestructura", "montoSiCorresponde": ""}, {"fecha": "15/01/2026", "titulo": "[FECHA APROX.] Torneo de Pádel organizado por socios", "descripcion": "Se realizó un Torneo de Pádel organizado por un grupo de socios, promoviendo la integración y la participación comunitaria.", "categoria": "Deportes", "montoSiCorresponde": ""}, {"fecha": "20/04/2026", "titulo": "Puesta en funcionamiento del Centro de Gestión Vecinal (CGV)", "descripcion": "Se puso en funcionamiento y se socializó entre los socios el Centro de Gestión Vecinal, una herramienta digital que centraliza en un único acceso desde el celular las consultas frecuentes: cuota social, pagos y cobranzas, Administración, Intendencia, Salón de Eventos, Gimnasio, Seguridad y Garita. Constituyó el primer paso hacia una comunicación institucional ordenada y permanente, en reemplazo de la dependencia de contactos individuales dispersos.", "categoria": "Administración", "montoSiCorresponde": ""}];

function jsonp(url, cb) {
  const cbName = 'cb_' + Date.now() + Math.floor(Math.random()*100000);
  window[cbName] = function(res) { delete window[cbName]; document.body.removeChild(script); cb(res); };
  const script = document.createElement('script');
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  document.body.appendChild(script);
}

const log = document.getElementById('log');

async function cargarTodo() {
  for (const n of NOVEDADES) {
    const div = document.createElement('div');
    div.className = 'item';
    div.textContent = n.titulo + ' — cargando...';
    log.appendChild(div);

    await new Promise(resolve => {
      const params = new URLSearchParams({
        action: 'guardarNovedadesSeleccionadas',
        novedades: JSON.stringify([n]),
        pin: '1923'
      });
      jsonp(EXEC_URL_GI + '?' + params.toString(), function(res) {
        if (res && res.ok && res.guardadas > 0) {
          div.className = 'item ok';
          div.textContent = '\u2705 ' + n.titulo;
        } else {
          div.className = 'item error';
          const motivo = (res && res.rechazadas && res.rechazadas[0]) ? res.rechazadas[0].motivo : (res && res.error) || 'error desconocido';
          div.textContent = '\u274c ' + n.titulo + ' — ' + motivo;
        }
        resolve();
      });
    });
  }
  const done = document.createElement('h1');
  done.textContent = '\u2705 Listo. Pod\u00e9s cerrar esta p\u00e1gina y volver a Novedades.';
  log.appendChild(done);
}

cargarTodo();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#135457">
<link rel="apple-touch-icon" href="https://i.imgur.com/UgiYLGk.png">
<link rel="icon" type="image/png" href="https://i.imgur.com/UgiYLGk.png">
<title>Gestión Institucional – La Eugenia</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --petroleo: #135457; --lima: #c4df57; --naranja: #deaf4d; --verdecl: #b7d6b5;
    --blanco: #ffffff; --hueso: #f5f3ec; --negro: #000000; --error: #c0392b;
  }
  body { margin: 0; min-height: 100vh; background: var(--petroleo); font-family: 'Roboto', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  @keyframes fadeInScreen { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes shakeError { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }

  .card { background: var(--verdecl); border-radius: 24px; width: 100%; max-width: 560px; padding: 28px 24px; box-sizing: border-box; box-shadow: 0 10px 28px rgba(0,0,0,0.4); }
  .logo-wrap img { width: 150px; display: block; margin: 0 auto; filter: drop-shadow(0 4px 7px rgba(0,0,0,0.2)); }
  h1 { margin: 2px 0 4px; color: var(--negro); font-family: Impact, sans-serif; font-size: 26px; letter-spacing: 1px; text-transform: uppercase; text-align: center; }
  .subtitle { text-align: center; color: var(--petroleo); font-size: 14px; margin-bottom: 20px; }

  #pinScreen { display: block; animation: fadeInScreen .3s ease-out; }
  #mainScreen { display: none; }
  #mainScreen.active { animation: fadeInScreen .3s ease-out; }
  .pin-label { text-align: center; color: var(--petroleo); font-size: 14px; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
  .pin-input { display: block; width: 100%; text-align: center; font-size: 28px; font-weight: 900; letter-spacing: 12px; border: 2px solid var(--petroleo); border-radius: 16px; padding: 12px; background: var(--blanco); color: var(--petroleo); outline: none; margin-bottom: 12px; }
  .pin-input.error { animation: shakeError .35s ease-in-out; border-color: var(--error); }
  .pin-error { text-align: center; color: var(--error); font-size: 13px; font-weight: 700; min-height: 18px; margin-bottom: 8px; }

  .ejercicio-box { background: var(--petroleo); border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; text-align: center; }
  .ejercicio-titulo { color: var(--lima); font-family: Impact, sans-serif; font-size: 15px; letter-spacing: .5px; text-transform: uppercase; }
  .ejercicio-sub { color: var(--hueso); font-size: 12px; margin-top: 2px; }

  .grid-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mod-card { background: var(--blanco); border-radius: 16px; padding: 16px 12px; text-align: center; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: transform .08s; }
  .mod-card:active { transform: scale(.96); }
  .mod-icon { font-size: 26px; }
  .mod-nombre { color: var(--petroleo); font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
  .mod-card.disabled { opacity: .45; pointer-events: none; }
  .mod-card.disabled .mod-nombre::after { content: ' (próx.)'; font-weight: 400; text-transform: none; font-size: 10px; }

  .btn-ghost { display: block; width: 100%; padding: 8px 10px 0; border-radius: 24px; border: none; background: transparent; color: var(--petroleo); font-family: 'Roboto'; font-size: 13px; font-weight: 700; text-transform: uppercase; cursor: pointer; text-align: center; }
  .btn-solid { display: block; width: 100%; padding: 14px; border-radius: 24px; border: 2px solid var(--petroleo); background: var(--naranja); color: var(--petroleo); font-family: 'Roboto'; font-size: 15px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-bottom: 10px; }
  .divider { border: none; border-top: 1.5px solid #9bb583; margin: 18px 0 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap"><img src="https://i.imgur.com/UgiYLGk.png" alt="Logo La Eugenia"></div>
  <h1>Gestión Institucional</h1>
  <div class="subtitle"><strong style="color:var(--negro);">Club de Campo La Eugenia</strong></div>

  <div id="pinScreen">
    <div class="pin-label">Ingresá el PIN</div>
    <input class="pin-input" type="password" inputmode="numeric" maxlength="4" id="pinInput" placeholder="····">
    <div class="pin-error" id="pinError"></div>
    <button type="button" class="btn-solid" onclick="verificarPin()">Ingresar</button>
  </div>

  <div id="mainScreen">
    <div class="ejercicio-box">
      <div class="ejercicio-titulo">Ejercicio N.º 37</div>
      <div class="ejercicio-sub">01/05/2025 – 30/04/2026 · Asamblea pendiente (24/10/2026)</div>
    </div>

    <div class="grid-cards">
      <a class="mod-card" href="autoridades.html">
        <span class="mod-icon">🧑‍⚖️</span>
        <span class="mod-nombre">Autoridades</span>
      </a>
      <a class="mod-card" href="actas.html">
        <span class="mod-icon">📝</span>
        <span class="mod-nombre">Bitácora y Actas</span>
      </a>
      <a class="mod-card disabled" href="#">
        <span class="mod-icon">💰</span>
        <span class="mod-nombre">Balance</span>
      </a>
      <a class="mod-card disabled" href="#">
        <span class="mod-icon">📜</span>
        <span class="mod-nombre">Memoria</span>
      </a>
      <a class="mod-card disabled" href="#">
        <span class="mod-icon">🏛️</span>
        <span class="mod-nombre">Asamblea</span>
      </a>
      <a class="mod-card disabled" href="#">
        <span class="mod-icon">📋</span>
        <span class="mod-nombre">Padrón</span>
      </a>
      <a class="mod-card disabled" href="#">
        <span class="mod-icon">📰</span>
        <span class="mod-nombre">Novedades</span>
      </a>
      <a class="mod-card disabled" href="#">
        <span class="mod-icon">📁</span>
        <span class="mod-nombre">Documentos</span>
      </a>
    </div>

    <hr class="divider">
    <button type="button" class="btn-ghost" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</div>

<script>
const EXEC_URL_PINES_CGV_CHECK = 'https://script.google.com/macros/s/AKfycbyt4PoL_IWHaXRlMNDy2cPtWmvj7f0-DLpSe5IHir54yPDNg8osPtX_0ezoopC4aGR_7A/exec';

let PIN_SESION = '';

document.addEventListener('DOMContentLoaded', function() {
  const savedPin = localStorage.getItem('cgv_pin');
  if (!savedPin) return;
  PIN_SESION = savedPin;
  jsonp(EXEC_URL_PINES_CGV_CHECK + '?action=validarPin&pin=' + encodeURIComponent(savedPin) + '&modulo=gestion-institucional', function(res) {
    if (res && res.ok && res.valido) {
      entrarApp();
    }
  });
});

function jsonp(url, cb) {
  const cbName = 'cb_' + Date.now() + Math.floor(Math.random()*100000);
  window[cbName] = function(res) { delete window[cbName]; document.body.removeChild(script); cb(res); };
  const script = document.createElement('script');
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  document.body.appendChild(script);
}

function verificarPin() {
  const pin = document.getElementById('pinInput').value;
  jsonp(EXEC_URL_PINES_CGV_CHECK + '?action=validarPin&pin=' + encodeURIComponent(pin) + '&modulo=gestion-institucional', function(res) {
    if (res && res.ok && res.valido) {
      PIN_SESION = pin;
      localStorage.setItem('cgv_pin', pin);
      entrarApp();
    } else {
      const input = document.getElementById('pinInput');
      input.classList.add('error');
      document.getElementById('pinError').textContent = 'PIN incorrecto';
      setTimeout(() => input.classList.remove('error'), 400);
    }
  });
}

function entrarApp() {
  document.getElementById('pinScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  document.getElementById('mainScreen').classList.add('active');
}

function cerrarSesion() {
  localStorage.removeItem('cgv_pin');
  location.reload();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carga de Novedades — reporte de Fernanda</title>
<style>
  body { font-family: sans-serif; background: #135457; color: #f5f3ec; padding: 20px; }
  .item { padding: 10px 14px; margin-bottom: 8px; border-radius: 10px; background: rgba(255,255,255,0.08); }
  .ok { background: #2d6a4f; }
  .error { background: #c0392b; }
  h1 { font-size: 16px; }
</style>
</head>
<body>
<h1>Cargando 5 novedades (Subcomisión de Seguridad + reporte de Fernanda)...</h1>
<div id="log"></div>

<script>
const EXEC_URL_GI = 'https://script.google.com/macros/s/AKfycbyBxlDAteVncpf2hyQ-Nna6YZjMiZodntG9gZZ9aPXPei1As_yhqMUCnjnM9mHmJYYZJg/exec';
const NOVEDADES = [{"fecha": "27/03/2026", "titulo": "Creación de la Subcomisión de Seguridad", "descripcion": "Se conformó la Subcomisión de Seguridad, un espacio de participación de socios para colaborar con la Comisión Directiva en el análisis de cuestiones de seguridad del barrio, sin sustituir sus atribuciones ni las del personal de seguridad. Entre sus primeras acciones se destacó la creación del Grupo de Alertas Vecinales, un canal específico para comunicar de forma inmediata situaciones relevantes de seguridad, diferenciándolas de la conversación general entre vecinos.", "categoria": "Seguridad", "montoSiCorresponde": ""}, {"fecha": "15/10/2025", "titulo": "[FECHA APROX.] Reparación de quinchos de paja", "descripcion": "Se realizaron tareas de reparación de los quinchos de paja del predio.", "categoria": "Mantenimiento", "montoSiCorresponde": ""}, {"fecha": "15/11/2025", "titulo": "[FECHA APROX.] Pintura general del sector club house y pileta", "descripcion": "Se realizaron trabajos de pintura general en el sector del club house y la pileta.", "categoria": "Mantenimiento", "montoSiCorresponde": ""}, {"fecha": "15/03/2026", "titulo": "[FECHA APROX.] Reparación de ventanas y puertas del salón", "descripcion": "Se realizaron trabajos de reparación de ventanas y puertas del salón de usos múltiples.", "categoria": "Mantenimiento", "montoSiCorresponde": ""}, {"fecha": "15/04/2026", "titulo": "[FECHA APROX.] Cambio de puerta del depósito de herramientas", "descripcion": "Se realizó el cambio de la puerta del depósito de herramientas.", "categoria": "Mantenimiento", "montoSiCorresponde": ""}];

function jsonp(url, cb) {
  const cbName = 'cb_' + Date.now() + Math.floor(Math.random()*100000);
  window[cbName] = function(res) { delete window[cbName]; document.body.removeChild(script); cb(res); };
  const script = document.createElement('script');
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  document.body.appendChild(script);
}

const log = document.getElementById('log');

async function cargarTodo() {
  for (const n of NOVEDADES) {
    const div = document.createElement('div');
    div.className = 'item';
    div.textContent = n.titulo + ' — cargando...';
    log.appendChild(div);

    await new Promise(resolve => {
      const params = new URLSearchParams({
        action: 'guardarNovedadesSeleccionadas',
        novedades: JSON.stringify([n]),
        pin: '1923'
      });
      jsonp(EXEC_URL_GI + '?' + params.toString(), function(res) {
        if (res && res.ok && res.guardadas > 0) {
          div.className = 'item ok';
          div.textContent = '\u2705 ' + n.titulo;
        } else {
          div.className = 'item error';
          const motivo = (res && res.rechazadas && res.rechazadas[0]) ? res.rechazadas[0].motivo : (res && res.error) || 'error desconocido';
          div.textContent = '\u274c ' + n.titulo + ' — ' + motivo;
        }
        resolve();
      });
    });
  }
  const done = document.createElement('h1');
  done.textContent = '\u2705 Listo. Pod\u00e9s cerrar esta p\u00e1gina.';
  log.appendChild(done);
}

cargarTodo();
</script>
</body>
</html>

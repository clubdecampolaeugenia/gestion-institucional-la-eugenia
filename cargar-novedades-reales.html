<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carga de Novedades reales</title>
<style>
  body { font-family: sans-serif; background: #135457; color: #f5f3ec; padding: 20px; }
  .item { padding: 10px 14px; margin-bottom: 8px; border-radius: 10px; background: rgba(255,255,255,0.08); }
  .ok { background: #2d6a4f; }
  .error { background: #c0392b; }
  h1 { font-size: 16px; }
</style>
</head>
<body>
<h1>Cargando 11 novedades reales (Actas 556-562)...</h1>
<div id="log"></div>

<script>
const EXEC_URL_GI = 'https://script.google.com/macros/s/AKfycbyBxlDAteVncpf2hyQ-Nna6YZjMiZodntG9gZZ9aPXPei1As_yhqMUCnjnM9mHmJYYZJg/exec';
const NOVEDADES = [{"fecha": "21/10/2025", "titulo": "Compra de red de vóley", "descripcion": "Se autorizó la compra de una red de vóley nueva por deterioro de la existente.", "categoria": "Deportes", "montoSiCorresponde": "75000"}, {"fecha": "02/12/2025", "titulo": "Nota formal a Municipalidad por calles", "descripcion": "Una socia redactó una nota a la Municipalidad de Garupá solicitando el arreglo de calles internas, respaldada con firmas de socios.", "categoria": "Municipalidad", "montoSiCorresponde": ""}, {"fecha": "06/12/2025", "titulo": "Inicio de temporada de pileta y colonia de vacaciones", "descripcion": "La temporada de pileta 2025/2026 comenzó el 6 de diciembre, con inicio de la Colonia de Vacaciones el 10 de diciembre y evento de apertura el 20 de diciembre con juegos, música en vivo y propuestas gastronómicas.", "categoria": "Pileta", "montoSiCorresponde": ""}, {"fecha": "03/02/2026", "titulo": "Daños en portón de vivienda por grupo de jóvenes", "descripcion": "Un socio reportó daños ocasionados por un grupo de jóvenes al portón de su vivienda, hecho registrado por cámaras de seguridad. Se acordó dialogar con los padres de los involucrados como medida preventiva.", "categoria": "Incidentes", "montoSiCorresponde": ""}, {"fecha": "03/02/2026", "titulo": "Continuidad del servicio de cantina", "descripcion": "Se solicitó a la responsable de la cantina que garantice la continuidad del servicio a los socios incluso durante eventos privados.", "categoria": "Cantina", "montoSiCorresponde": ""}, {"fecha": "10/03/2026", "titulo": "Problemas de baja tensión eléctrica — gestión ante EMSA", "descripcion": "Se consultó con EMSA por problemas de baja tensión, atribuidos al cambio de suministro desde Posadas a la red de Apóstoles. Se elaboró una nota formal para presentar ante EMSA con firmas de los vecinos afectados.", "categoria": "EMSA", "montoSiCorresponde": ""}, {"fecha": "10/03/2026", "titulo": "Hechos de inseguridad en el barrio", "descripcion": "Se registraron hurtos nocturnos y un hecho de mayor gravedad con ingreso a una vivienda mediante arma blanca. Se recomendó a los vecinos extremar precauciones básicas.", "categoria": "Seguridad", "montoSiCorresponde": ""}, {"fecha": "18/03/2026", "titulo": "Foro de Seguridad con autoridades provinciales", "descripcion": "Se organizó un Foro de Seguridad con participación de autoridades del Ministerio de Gobierno y la Policía de Misiones, donde se analizaron los hechos de inseguridad del barrio y se propusieron medidas preventivas, incluyendo la conformación de una Comisión Vecinal de Seguridad.", "categoria": "Seguridad", "montoSiCorresponde": ""}, {"fecha": "14/04/2026", "titulo": "Adquisición de motoguadaña y reparación del cachape", "descripcion": "Se adquirió una nueva motoguadaña para tareas de mantenimiento y se realizó inversión para la reparación del cachape, incluyendo el cambio de rodado.", "categoria": "Mantenimiento", "montoSiCorresponde": ""}, {"fecha": "16/06/2026", "titulo": "Puesta en funcionamiento del Centro de Gestión Vecinal", "descripcion": "El Centro de Gestión Vecinal (CGV) entró en funcionamiento, concentrando trámites, comunicación con responsables y consulta del valor de la cuota social.", "categoria": "Administración", "montoSiCorresponde": ""}, {"fecha": "16/06/2026", "titulo": "Renovación integral del sector de ingreso al Club", "descripcion": "Se realizaron tareas de mantenimiento del pavimento de la vía de ingreso, pintura de la casilla de guardia, instalación de nueva iluminación integral y trabajos de herrería en el portón de acceso de camiones.", "categoria": "Infraestructura", "montoSiCorresponde": ""}];

function jsonp(url, cb) {
  const cbName = 'cb_' + Date.now() + Math.floor(Math.random()*100000);
  window[cbName] = function(res) { delete window[cbName]; document.body.removeChild(script); cb(res); };
  const script = document.createElement('script');
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  document.body.appendChild(script);
}

const log = document.getElementById('log');

async function cargarTodo() {
  for (const n of NOVEDADES) {
    const div = document.createElement('div');
    div.className = 'item';
    div.textContent = n.titulo + ' — cargando...';
    log.appendChild(div);

    await new Promise(resolve => {
      const params = new URLSearchParams({
        action: 'guardarNovedadesSeleccionadas',
        novedades: JSON.stringify([n]),
        pin: '1923'
      });
      jsonp(EXEC_URL_GI + '?' + params.toString(), function(res) {
        if (res && res.ok) {
          div.className = 'item ok';
          div.textContent = '\u2705 ' + n.titulo;
        } else {
          div.className = 'item error';
          div.textContent = '\u274c ' + n.titulo + ' — ' + (res && res.error ? res.error : 'error desconocido');
        }
        resolve();
      });
    });
  }
  const done = document.createElement('h1');
  done.textContent = '\u2705 Listo. Pod\u00e9s cerrar esta p\u00e1gina y volver a Novedades.';
  log.appendChild(done);
}

cargarTodo();
</script>
</body>
</html>

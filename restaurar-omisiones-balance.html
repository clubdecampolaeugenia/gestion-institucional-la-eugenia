<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurar omisiones — Balance v3</title>
<style>
  body { font-family: sans-serif; background: #135457; color: #f5f3ec; padding: 20px; }
  .item { padding: 10px 14px; margin-bottom: 8px; border-radius: 10px; background: rgba(255,255,255,0.08); }
  .ok { background: #2d6a4f; }
  .error { background: #c0392b; }
  h1 { font-size: 16px; }
</style>
</head>
<body>
<h1>Restaurando 9 observaciones a OMITIDA en Balance v3...</h1>
<div id="log"></div>

<script>
const EXEC_URL_GI = 'https://script.google.com/macros/s/AKfycbyBxlDAteVncpf2hyQ-Nna6YZjMiZodntG9gZZ9aPXPei1As_yhqMUCnjnM9mHmJYYZJg/exec';
const ID_BALANCE = 'BAL-20260810090030';
const TOTAL_OBSERVACIONES = 9;

function jsonp(url, cb) {
  const cbName = 'cb_' + Date.now() + Math.floor(Math.random()*100000);
  window[cbName] = function(res) { delete window[cbName]; document.body.removeChild(script); cb(res); };
  const script = document.createElement('script');
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  document.body.appendChild(script);
}

const log = document.getElementById('log');

async function restaurarTodo() {
  for (let i = 0; i < TOTAL_OBSERVACIONES; i++) {
    const div = document.createElement('div');
    div.className = 'item';
    div.textContent = 'Observación ' + (i + 1) + ' — omitiendo...';
    log.appendChild(div);

    await new Promise(resolve => {
      const params = new URLSearchParams({ action: 'actualizarObservacionBalance', idBalance: ID_BALANCE, indice: i, estadoObs: 'OMITIDA', pin: '1923' });
      jsonp(EXEC_URL_GI + '?' + params.toString(), function(res) {
        if (res && res.ok) {
          div.className = 'item ok';
          div.textContent = '\u2705 Observación ' + (i + 1) + ' — ' + (res.estadoGeneral || 'OMITIDA');
        } else {
          div.className = 'item error';
          div.textContent = '\u274c Observación ' + (i + 1) + ' — ' + (res && res.error ? res.error : 'error');
        }
        resolve();
      });
    });
  }
  const done = document.createElement('h1');
  done.textContent = '\u2705 Listo. Volv\u00e9 a Balance y refrescá.';
  log.appendChild(done);
}

restaurarTodo();
</script>
</body>
</html>
